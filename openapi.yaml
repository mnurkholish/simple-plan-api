openapi: 3.1.0

info:
  title: SIMPLE-PLAN API
  version: 0.1.0
  description: |
    Kontrak API backend SIMPLE-PLAN RS Citra Husada.

    File ini dikembangkan bertahap mengikuti SRS dan kebutuhan Sprint.
    Hanya endpoint dan struktur data yang sudah disepakati yang sebaiknya
    ditambahkan sebagai kontrak final.

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: Helpdesk
    description: Pengelolaan tiket Helpdesk TIK dan Sarpras
  - name: Assets
    description: Pencarian asset
  - name: Units
    description: Pencarian unit
  - name: Users
    description: Pengelolaan dan pencarian user

paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: List all notifications for the authenticated user
      operationId: listNotifications
      x-auth-required: true
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Notifications ordered newest first, including read state and pagination.
          content:
            application/json:
              schema:
                type: object
                required: [data, unread_count, activity, current_page, last_page, per_page, total]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, title, subtitle, is_read, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        subtitle: { type: string }
                        target:
                          type: [object, 'null']
                          description: Navigation metadata. Null for notifications without a detail destination.
                          properties:
                            feature: { type: string, example: helpdesk }
                            service: { type: string, enum: [tik, sarpras], description: Helpdesk service; other features may use different metadata. }
                            resource_id: { type: integer, example: 123 }
                        ticket_id: { type: [integer, 'null'], description: Related ticket ID when this is a ticket notification. }
                        nomor_tiket: { type: [string, 'null'], description: Related ticket number when this is a ticket notification. }
                        url: { type: [string, 'null'], description: Frontend ticket detail path (/helpdesk/tik/{id} or /helpdesk/sarpras/{id}) for ticket notifications. }
                        is_read: { type: boolean }
                        created_at: { type: [string, 'null'], format: date-time }
                  unread_count: { type: integer }
                  activity: { type: array, items: { type: object } }
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        "401": { description: Unauthenticated. }
        "422": { description: Invalid pagination parameters. }

  /assets/{asset}/label:
    get:
      tags: [Assets]
      summary: Preview or download an inventory asset label
      operationId: getAssetLabel
      x-auth-required: true
      parameters:
        - name: asset
          in: path
          required: true
          schema: { type: integer }
        - name: format
          in: query
          schema: { type: string, enum: [html, png, pdf], default: html }
        - name: width_mm
          in: query
          schema: { type: number, minimum: 50, maximum: 150, default: 90 }
        - name: height_mm
          in: query
          schema: { type: number, minimum: 25, maximum: 100, default: 50 }
      responses:
        "200":
          description: The inventory label in the requested format.
          content:
            text/html:
              schema: { type: string }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Unauthenticated. }
        "403": { description: Label access or printing is forbidden. }
        "404": { description: Asset not found. }
        "422": { description: Invalid format or label dimensions. }

  /asset-label-exports:
    post:
      tags: [Assets]
      summary: Export inventory labels as an A4 PDF
      operationId: exportAssetLabels
      description: |
        Creates a PDF synchronously. In selected mode labels follow asset_ids order.
        In all_filtered mode the same filters as GET /assets are applied without
        pagination, and labels follow descending asset ID order. Only Inventory
        assets with an asset code can be printed. Each asset requires printLabel
        authorization. A4 pages use 10 mm margins and 2 mm gaps. For backward
        compatibility, omitting selection_mode is equivalent to selected.
      x-auth-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [asset_ids, width_mm, height_mm]
                  properties:
                    selection_mode: { type: string, const: selected, default: selected }
                    asset_ids:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: { type: integer, minimum: 1 }
                      example: [1, 2, 3]
                    width_mm: { type: number, minimum: 50, maximum: 150, example: 90 }
                    height_mm: { type: number, minimum: 25, maximum: 100, example: 50 }
                - type: object
                  required: [selection_mode, filters, width_mm, height_mm]
                  properties:
                    selection_mode: { type: string, const: all_filtered }
                    filters:
                      type: object
                      description: Uses the same filters as GET /assets. page and per_page are accepted but ignored.
                      properties:
                        search: { type: string }
                        location_id: { type: integer }
                        status: { type: string, enum: [Digunakan, Tidak Digunakan, Rusak, Dipinjam] }
                        classification_id: { type: integer }
                        moved_last_3_months: { type: boolean, description: 'When true, requires a location change in the last three months.' }
                        asset_location_id: { type: integer, description: 'Legacy alias for location_id.' }
                        asset_classification_id: { type: integer, description: 'Legacy alias for classification_id.' }
                        asset_item_id: { type: integer }
                        condition: { type: string, enum: [Baik, Rusak Ringan, Rusak Berat] }
                        purchase_year: { type: integer }
                        year: { type: integer, description: 'Legacy alias for purchase_year.' }
                        page: { type: integer, description: 'Ignored for export.' }
                        per_page: { type: integer, description: 'Ignored for export.' }
                    width_mm: { type: number, minimum: 50, maximum: 150, example: 90 }
                    height_mm: { type: number, minimum: 25, maximum: 100, example: 50 }
      responses:
        "200":
          description: A4 PDF containing all selected labels.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="asset-labels-a4.pdf"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Unauthenticated. }
        "403": { description: Printing at least one selected asset is forbidden. }
        "422": { description: "Invalid selection, filters, label dimensions, or no printable assets matched." }

  /assets:
    get:
      tags: [Assets]
      summary: List inventory assets
      operationId: listInventoryAssets
      x-auth-required: true
      description: Filters are optional, combined with AND, and applied before pagination. Results are ordered by descending asset ID. A true moved_last_3_months value requires at least one location change history within the last three months; false does not restrict the list.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: asset_classification_id
          in: query
          description: Legacy alias for classification_id.
          schema: { type: integer }
        - name: classification_id
          in: query
          description: Filter by current asset classification.
          schema: { type: integer }
        - name: asset_location_id
          in: query
          description: Legacy alias for location_id.
          schema: { type: integer }
        - name: location_id
          in: query
          description: Filter by current asset room, through asset_codes.asset_location_id.
          schema: { type: integer }
        - name: asset_item_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [Digunakan, Tidak Digunakan, Rusak, Dipinjam] }
        - name: condition
          in: query
          schema: { type: string, enum: [Baik, Rusak Ringan, Rusak Berat] }
        - name: purchase_year
          in: query
          schema: { type: integer }
        - name: year
          in: query
          description: Legacy alias for purchase_year.
          schema: { type: integer }
        - name: moved_last_3_months
          in: query
          description: When true, include only assets with a location change in the last three months.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryAsset" }
        "401": { description: Unauthenticated. }
        "403": { description: Inventory access forbidden. }
        "422": { description: Invalid filter value. }
    post:
      tags: [Assets]
      summary: Registrasi aset fisik
      operationId: createInventoryAsset
      x-auth-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/InventoryAssetInput" }
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAssetInput" }
      responses:
        "201":
          description: Aset dan nomor inventaris dibuat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAssetResponse" }

  /assets/generate-number:
    get:
      tags: [Assets]
      summary: Pratinjau nomor inventaris berdasarkan tahun pembelian
      operationId: previewInventoryNumber
      x-auth-required: true
      description: Pratinjau tidak mereservasi nomor; nomor final ditetapkan saat aset disimpan.
      parameters:
        - name: asset_classification_id
          in: query
          required: true
          schema: { type: integer }
        - name: asset_location_id
          in: query
          required: true
          schema: { type: integer }
        - name: asset_item_id
          in: query
          required: true
          schema: { type: integer }
        - name: year
          in: query
          required: true
          description: Tahun pembelian, 1900–2100.
          schema: { type: integer }
      responses:
        "200":
          description: Nomor inventaris yang diperkirakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      full_code: { type: string }

  /assets/{asset}:
    parameters:
      - name: asset
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Assets]
      operationId: getInventoryAsset
      x-auth-required: true
      responses:
        "200":
          description: Detail aset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAssetResponse" }
    put:
      tags: [Assets]
      operationId: updateInventoryAsset
      x-auth-required: true
      description: Update parsial; asset_uid tetap. Perubahan nomor tersimpan dalam satu riwayat update.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAssetInput" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/InventoryAssetInput" }
      responses:
        "200":
          description: Aset diperbarui.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAssetResponse" }
    post:
      tags: [Assets]
      operationId: updateInventoryAssetMultipart
      x-auth-required: true
      description: Pembaruan multipart memakai field _method=PUT.
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/InventoryAssetInput"
                - type: object
                  properties:
                    _method: { type: string, enum: [PUT] }
      responses:
        "200":
          description: Aset diperbarui.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAssetResponse" }
    delete:
      tags: [Assets]
      operationId: deleteInventoryAsset
      x-auth-required: true
      responses:
        "200": { description: Aset dihapus secara soft delete; kode tetap tersimpan. }

  /assets/uid/{uid}:
    get:
      tags: [Inventory - QrCode Label]
      summary: Get asset by UID after QR scan
      operationId: getAssetByUid
      x-auth-required: true
      parameters:
        - name: uid
          in: path
          required: true
          description: Permanent asset UID encoded directly in the QR code.
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        "200":
          description: Asset found.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, uid, code, name, brand, location]
                    properties:
                      id: { type: integer }
                      uid: { type: string }
                      code: { type: [string, 'null'], description: Current asset_codes.full_code; null for an uncoded asset. }
                      name: { type: string, description: Asset item name and detail_item joined with a space. }
                      brand: { type: string, description: Brand and model_specification joined with a space. }
                      location: { type: string, description: Asset location name and location_detail joined with a space. }
        "401": { description: Unauthenticated. }
        "403": { description: Asset access forbidden. }
        "404": { description: Asset UID not found. }

  /asset-items:
    get:
      tags: [Assets]
      summary: List inventory item master data
      operationId: listAssetItems
      x-auth-required: true
      description: When location_id is supplied, only item types belonging to an active asset at that location are returned.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: location_id
          in: query
          description: Filter items to those used by an active asset at this location.
          schema: { type: integer }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Asset item options. Pagination metadata is included when page or per_page is supplied.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryMaster" }
        "401": { description: Unauthenticated. }
        "403": { description: Inventory access forbidden. }
        "422": { description: Invalid location_id. }
    post:
      tags: [Assets]
      operationId: createAssetItem
      x-auth-required: true
      description: Master nama barang. Merek disimpan pada aset fisik.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryMasterInput" }
      responses:
        "201": { description: Master barang dibuat. }

  /asset-locations:
    get:
      tags: [Assets]
      summary: List inventory location master data
      operationId: listAssetLocations
      x-auth-required: true
      description: Returns the asset location master data using the existing search and optional pagination behavior.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Asset location options. Pagination metadata is included when page or per_page is supplied.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryMaster" }
        "401": { description: Unauthenticated. }
        "403": { description: Inventory access forbidden. }
    post:
      tags: [Assets]
      operationId: createAssetLocation
      x-auth-required: true
      description: Master lokasi ruangan dengan kode integer unik.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryMasterInput" }
      responses:
        "201": { description: Master lokasi dibuat. }

  /tickets:
    get:
      tags: [Helpdesk]
      summary: Melihat daftar tiket
      operationId: listTickets
      x-auth-required: true
      x-required-permission: tickets-access
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: service
          in: query
          required: false
          description: Jenis layanan tiket.
          schema:
            type: string
            enum: [tik, sarpras]
            example: tik
        - name: status
          in: query
          required: false
          description: Filter status tiket.
          schema:
            type: string
            enum:
              [baru, diklasifikasi, diproses, eskalasi, terselesaikan, ditutup, ditolak]
            example: baru
        - name: priority
          in: query
          required: false
          description: Filter prioritas tiket.
          schema:
            type: string
            enum: [critical, high, medium, low]
            example: high
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Batas akhir tanggal dibuat, bersifat inklusif.
        - name: search
          in: query
          required: false
          description: Pencarian berdasarkan nama reporter atau nama unit tiket.
          schema:
            type: string
            maxLength: 255
        - name: status_sla
          in: query
          required: false
          schema:
            type: string
            enum:
              - melewati_batas
              - mendekati_batas
              - tepat_waktu
          description: Filter tiket berdasarkan status SLA secara on-the-fly.
      responses:
        "200":
          description: Daftar tiket berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCollectionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          $ref: "#/components/responses/TicketValidationError"

    post:
      tags: [Helpdesk]
      summary: Membuat tiket
      operationId: createTicket
      description: Reporter dan unit diambil dari authenticated user. Status awal selalu baru.
      x-auth-required: true
      x-required-permission: tickets-create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Tiket berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCreateResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/classification-options:
    get:
      tags: [Helpdesk]
      summary: Mengambil opsi klasifikasi tiket
      operationId: listTicketClassificationOptions
      description: |
        Mengembalikan master aktif yang diperlukan form klasifikasi. Service
        TIK memperoleh quality_categories dan it_tags, sedangkan service
        Sarpras memperoleh sarpras_categories.
      x-auth-required: true
      x-required-permission: tickets-verify
      parameters:
        - name: service
          in: query
          required: true
          description: Jenis layanan tiket yang akan diklasifikasikan.
          schema:
            type: string
            enum: [tik, sarpras]
            example: tik
      responses:
        "200":
          description: Opsi klasifikasi berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationOptionsResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}:
    get:
      tags: [Helpdesk]
      summary: Melihat detail tiket
      operationId: showTicket
      x-auth-required: true
      x-required-permission: tickets-access
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Detail tiket berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReadResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"

  /tickets/{ticket}/classify:
    post:
      tags: [Helpdesk]
      summary: Mengklasifikasikan tiket baru
      operationId: classifyTicket
      description: |
        TIK hanya dapat diklasifikasikan Super Admin. Sarpras dapat
        diklasifikasikan Super Admin atau Koordinator Sarpras. Capability
        umum endpoint tetap menggunakan permission tickets-verify.
      x-auth-required: true
      x-required-permission: tickets-verify
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyTicketRequest"
      responses:
        "200":
          description: Tiket berhasil diklasifikasikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/reject:
    post:
      tags: [Helpdesk]
      summary: Menolak tiket baru
      operationId: rejectTicket
      description: Actor mengikuti hak klasifikasi service tiket dan tiket harus berstatus baru.
      x-auth-required: true
      x-required-permission: tickets-reject
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTicketRequest"
      responses:
        "200":
          description: Tiket berhasil ditolak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/assignee-options:
    get:
      tags: [Helpdesk]
      summary: Mencari kandidat petugas assignment
      operationId: listTicketAssigneeOptions
      description: |
        Kandidat TIK dibatasi pada user aktif dengan role Super Admin atau
        Petugas TIK. Kandidat Sarpras dibatasi pada user aktif dengan role
        Koordinator Sarpras atau Petugas Sarpras. Search mencocokkan name dan
        jabatan.
      x-auth-required: true
      x-required-permission: tickets-assign
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Kandidat petugas berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssigneeOptionCollectionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/assign:
    post:
      tags: [Helpdesk]
      summary: Assignment atau reassignment tiket
      operationId: assignTicket
      description: |
        TIK hanya dapat di-assign Super Admin kepada Super Admin atau Petugas
        TIK. Sarpras hanya dapat di-assign Koordinator Sarpras kepada Koordinator
        Sarpras atau Petugas Sarpras. Assignment pertama dari Diklasifikasi
        menentukan priority, langsung mengubah status menjadi Diproses, serta
        mencatat sla_started_at dan SLA deadline.
        Reassignment dari Diproses hanya mengganti petugas dan assigned_at;
        waktu mulai serta deadline SLA pertama tidak direset.
      x-auth-required: true
      x-required-permission: tickets-assign
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: Assignment atau reassignment berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/handlings:
    post:
      tags: [Helpdesk]
      summary: Menambahkan riwayat penanganan tiket
      operationId: createTicketHandling
      description: |
        Super Admin dapat menangani tiket TIK dan Sarpras tanpa assignment.
        Koordinator Sarpras dapat menangani tiket Sarpras tanpa assignment.
        Petugas TIK dan Petugas Sarpras hanya dapat menangani tiket yang sedang
        ditugaskan kepadanya sesuai service masing-masing.
        Tiket Diproses dapat tetap Diproses tanpa status history atau menjadi
        Terselesaikan dengan status history. tickets.completed_at berasal dari
        completed_at yang diinput petugas, bukan dari waktu perubahan status.
        Operasi tidak menghitung ulang SLA. Membutuhkan permission tickets-handle.
      x-auth-required: true
      x-required-permission: tickets-handle
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTicketHandlingRequest"
      responses:
        "200":
          description: Riwayat penanganan berhasil disimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/escalate:
    post:
      tags: [Helpdesk]
      summary: Mengeskalasi tiket Helpdesk
      operationId: escalateTicket
      description: |
        Super Admin dapat mengeskalasi tiket TIK dan Sarpras tanpa assignment.
        Koordinator Sarpras dapat mengeskalasi tiket Sarpras tanpa assignment.
        Petugas hanya dapat mengeskalasi tiket yang ditugaskan kepadanya sesuai
        service. Target eskalasi adalah Manajemen, Vendor, atau Tim Terkait.
        Membutuhkan permission tickets-handle.
      x-auth-required: true
      x-required-permission: tickets-handle
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateTicketRequest"
      responses:
        "200":
          description: Tiket berhasil dieskalasikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/de-escalate:
    post:
      tags: [Helpdesk]
      summary: Melanjutkan penanganan tiket setelah eskalasi
      operationId: deEscalateTicket
      description: |
        Cakupan actor sama dengan endpoint eskalasi: Super Admin untuk TIK dan
        Sarpras, Koordinator Sarpras untuk Sarpras, serta petugas yang ditugaskan
        sesuai service. Mengembalikan status Eskalasi ke Diproses dan
        membutuhkan permission tickets-handle.
      x-auth-required: true
      x-required-permission: tickets-handle
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Tiket kembali diproses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"

  /tickets/{ticket}/verify:
    post:
      tags: [Helpdesk]
      summary: Memverifikasi penyelesaian tiket
      operationId: verifyTicketResolution
      description: |
        Hanya reporter tiket yang dapat memverifikasi tiket berstatus
        Terselesaikan. Verifikasi langsung mengubah status menjadi Ditutup tanpa
        status perantara Terverifikasi dan mencatat closed_at serta status history.
      x-auth-required: true
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTicketRequest"
      responses:
        "200":
          description: Penyelesaian diverifikasi dan tiket ditutup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /assets/search:
    get:
      tags: [Assets]
      summary: Mencari asset berdasarkan lokasi ruangan, nomor, atau nama
      operationId: searchAssets
      description: Mengembalikan aset pada lokasi ruangan yang dipilih. Lokasi aset tidak bergantung pada unit pelapor.
      x-auth-required: true
      x-required-permission: tickets-create
      parameters:
        - name: location_id
          in: query
          required: true
          description: ID lokasi ruangan pada master asset_locations.
          schema:
            type: integer
            example: 1
        - name: search
          in: query
          required: false
          description: Nomor inventaris atau nama barang yang dicari.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: Meja
      responses:
        "200":
          description: Hasil pencarian asset berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryAsset"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          description: Parameter pencarian asset tidak valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReadError"

  /units/search:
    get:
      tags: [Units]
      summary: Mencari unit berdasarkan nama
      operationId: searchUnits
      description: Mengembalikan unit yang unit_name-nya mengandung nilai search.
      x-auth-required: true
      x-required-permission: tickets-create
      parameters:
        - name: search
          in: query
          required: false
          description: Nama atau sebagian nama unit yang dicari.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: ICU
      responses:
        "200":
          description: Hasil pencarian unit berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnitSearchResult"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          description: Parameter pencarian unit tidak valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReadError"

  /users/search:
    get:
      tags: [Users]
      summary: Mencari user berdasarkan nama
      operationId: searchUsersByName
      description: Mengembalikan user yang namanya mengandung nilai parameter name beserta unitnya.
      x-auth-required: true
      x-required-permission: users-access
      parameters:
        - name: name
          in: query
          required: true
          description: Nama atau sebagian nama user yang dicari.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: Rani
      responses:
        "200":
          description: Hasil pencarian user berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchCollectionResponse"
        "401":
          $ref: "#/components/responses/UserSearchUnauthenticated"
        "403":
          $ref: "#/components/responses/UserSearchForbidden"
        "422":
          $ref: "#/components/responses/UserSearchValidationError"

components:
  parameters:
    TicketId:
      name: ticket
      in: path
      required: true
      schema:
        type: integer
      description: ID internal tiket.

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

  schemas:
    InventoryMaster:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer }
        code: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InventoryMasterInput:
      type: object
      required: [code, name]
      properties:
        code: { type: integer, minimum: 1 }
        name: { type: string }

    InventoryAssetInput:
      type: object
      description: Semua field wajib saat registrasi; seluruhnya opsional saat update parsial. asset_uid dibuat server.
      properties:
        asset_classification_id: { type: integer }
        asset_location_id: { type: integer, description: Lokasi ruangan. }
        asset_item_id: { type: integer }
        purchase_year: { type: integer, minimum: 1900, maximum: 2100 }
        brand: { type: [string, "null"], maxLength: 100 }
        model_specification: { type: [string, "null"], maxLength: 100 }
        detail_item: { type: [string, "null"], maxLength: 255 }
        location_detail: { type: [string, "null"], maxLength: 100 }
        serial_number: { type: [string, "null"] }
        status: { type: string, enum: [Digunakan, Tidak Digunakan, Rusak, Dipinjam] }
        condition: { type: string, enum: [Baik, Rusak Ringan, Rusak Berat] }
        warranty_until: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        photo: { type: string, format: binary }
        calibration_document: { type: string, format: binary }

    InventoryAsset:
      type: object
      required: [id, asset_uid, status, condition]
      properties:
        id: { type: integer, description: Primary key internal dan relasi tickets.asset_id. }
        asset_uid: { type: string, minLength: 26, maxLength: 26, description: ULID permanen untuk identitas QR. }
        asset_code:
          type: [object, "null"]
          properties:
            id: { type: integer }
            full_code: { type: string }
            sequence_number: { type: integer }
            classification: { type: [object, "null"] }
            location: { type: [object, "null"] }
            item: { type: [object, "null"] }
        brand: { type: [string, "null"] }
        model_specification: { type: [string, "null"] }
        detail_item: { type: [string, "null"] }
        location_detail: { type: [string, "null"] }
        serial_number: { type: [string, "null"] }
        purchase_year: { type: [integer, "null"] }
        status: { type: string }
        condition: { type: string }
        warranty_until: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        photo: { type: [object, "null"] }
        calibration_document: { type: [object, "null"] }
        histories:
          type: array
          items:
            $ref: "#/components/schemas/AssetHistory"

    AssetHistory:
      type: object
      required: [id, event_type, is_location_change, created_at]
      properties:
        id: { type: integer, example: 1 }
        event_type: { type: string, example: updated }
        old_values:
          type: [object, "null"]
          example:
            location_name: "Gudang Farmasi"
            asset_location_id: 1
            full_code: "1/1/1/1/2026"
        new_values:
          type: [object, "null"]
          example:
            location_name: "Ruang ICU"
            asset_location_id: 2
            full_code: "1/2/1/1/2026"
        is_location_change: { type: boolean, example: true }
        changed_by_name: { type: [string, "null"], example: "Super Admin" }
        created_at: { type: string, format: date-time, example: "2026-10-20T10:00:00.000000Z" }

    InventoryAssetResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/InventoryAsset" }
        message: { type: string }

    UnitSearchResult:
      type: object
      additionalProperties: false
      required: [id, unit_name]
      properties:
        id:
          type: integer
          example: 1
        unit_name:
          type: string
          example: ICU

    UserSearchResult:
      type: object
      additionalProperties: false
      required: [id, name, unit]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Dr. Rani
        unit:
          oneOf:
            - $ref: "#/components/schemas/UserSearchUnit"
            - type: "null"

    UserSearchUnit:
      type: object
      additionalProperties: false
      required: [id, unit_name]
      properties:
        id:
          type: integer
          example: 3
        unit_name:
          type: string
          example: ICU

    UserSearchCollectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserSearchResult"

    UserSearchError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    TicketRead:
      type: object
      additionalProperties: false
      required:
        - id
        - ticket_number
        - service
        - category
        - tik_detail
        - sarpras_detail
        - description
        - status
        - rejection_reason
        - priority
        - asset
        - reporter
        - unit
        - assigned_officer
        - classified_by
        - initial_evidence
        - classified_at
        - assigned_at
        - sla_started_at
        - sla_deadline
        - completed_at
        - closed_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        ticket_number:
          type: string
          pattern: "^(TIK|SPR)-[0-9]{4}-[0-9]{6}$"
          example: TIK-2026-000001
        service:
          type: string
          enum: [tik, sarpras]
          description: Jenis layanan tiket.
          example: tik
        category:
          type:
            - string
            - "null"
          description: Label kompatibilitas yang diturunkan dari detail klasifikasi tiket.
          example: Perangkat Komputer
        tik_detail:
          anyOf:
            - $ref: "#/components/schemas/TicketTikDetail"
            - type: "null"
        sarpras_detail:
          anyOf:
            - $ref: "#/components/schemas/TicketSarprasDetail"
            - type: "null"
        description:
          type: string
          example: Komputer tidak dapat menyala.
        status:
          type: string
          enum: [baru, diklasifikasi, diproses, eskalasi, terselesaikan, ditutup, ditolak]
          example: baru
        rejection_reason:
          type:
            - string
            - "null"
          description: Field kompatibilitas dari notes status history penolakan terbaru.
          example: Informasi kerusakan tidak sesuai.
        priority:
          type:
            - string
            - "null"
          enum: [critical, high, medium, low, null]
          example: high
        asset:
          anyOf:
            - $ref: "#/components/schemas/AssetSummary"
            - type: "null"
        reporter:
          $ref: "#/components/schemas/UserSummary"
        unit:
          $ref: "#/components/schemas/UnitSummary"
        assigned_officer:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        classified_by:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        initial_evidence:
          anyOf:
            - $ref: "#/components/schemas/FileMetadata"
            - type: "null"
        classified_at:
          type:
            - string
            - "null"
          format: date-time
        assigned_at:
          type:
            - string
            - "null"
          format: date-time
        sla_started_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu tiket pertama kali masuk Diproses dan SLA mulai berjalan.
        sla_deadline:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        closed_at:
          type:
            - string
            - "null"
          format: date-time
        handlings:
          type: array
          description: Tersedia pada response detail dan pembaruan penanganan.
          items:
            $ref: "#/components/schemas/TicketHandling"
        status_histories:
          type: array
          description: Tersedia pada response detail tiket.
          items:
            $ref: "#/components/schemas/TicketStatusHistory"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    UnitSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    AssetSummary:
      type: object
      additionalProperties: false
      required: [id, asset_number, name, brand, location, status]
      properties:
        id:
          type: integer
        asset_number:
          type: string
        name:
          type: string
        brand:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        status:
          type: string

    TicketStatusHistory:
      type: object
      additionalProperties: false
      required: [id, from_status, to_status, changed_by, notes, created_at]
      properties:
        id:
          type: integer
        from_status:
          type:
            - string
            - "null"
          enum:
            [
              baru,
              diklasifikasi,
              ditugaskan,
              diproses,
              eskalasi,
              terselesaikan,
              terverifikasi,
              ditutup,
              ditolak,
              null,
            ]
        to_status:
          type: string
          enum:
            [
              baru,
              diklasifikasi,
              ditugaskan,
              diproses,
              eskalasi,
              terselesaikan,
              terverifikasi,
              ditutup,
              ditolak,
            ]
        changed_by:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        notes:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time

    TicketNamedReference:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    ClassificationOptionsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [service, quality_categories, it_tags, sarpras_categories]
          properties:
            service:
              type: string
              enum: [tik, sarpras]
            quality_categories:
              type: array
              description: Berisi data hanya ketika service adalah tik.
              items:
                $ref: "#/components/schemas/TicketNamedReference"
            it_tags:
              type: array
              description: Berisi IT tag aktif hanya ketika service adalah tik.
              items:
                $ref: "#/components/schemas/TicketNamedReference"
            sarpras_categories:
              type: array
              description: Berisi kategori aktif hanya ketika service adalah sarpras.
              items:
                $ref: "#/components/schemas/TicketNamedReference"

    TicketTikDetail:
      type: object
      additionalProperties: false
      required:
        - quality_category
        - it_tag
        - custom_it_tag_text
      properties:
        quality_category:
          $ref: "#/components/schemas/TicketNamedReference"
        it_tag:
          $ref: "#/components/schemas/TicketNamedReference"
        custom_it_tag_text:
          type:
            - string
            - "null"

    TicketSarprasDetail:
      type: object
      additionalProperties: false
      required:
        - sarpras_category
      properties:
        sarpras_category:
          $ref: "#/components/schemas/TicketNamedReference"

    FileMetadata:
      type: object
      additionalProperties: false
      required:
        - original_name
        - mime_type
        - size
      properties:
        original_name:
          type: string
          example: kerusakan-komputer.jpg
        mime_type:
          type: string
          example: image/jpeg
        size:
          type: integer
          description: Ukuran file dalam byte.
          example: 245760
        url:
          type: string
          format: uri
          description: Temporary URL yang hanya disertakan pada response detail/show ticket dan dihasilkan saat runtime dari object key pada configured filesystem disk.
          example: https://simple-plan.internal/storage/local/helpdesk/evidence/example.jpg?expires=1790985600&signature=example

    CreateTicketRequest:
      type: object
      required:
        - service
        - description
      properties:
        service:
          type: string
          enum: [tik, sarpras]
          example: tik
        asset_id:
          type:
            - integer
            - "null"
          description: Asset aktif yang terkait dengan tiket, jika ada.
        description:
          type: string
        initial_evidence:
          type:
            - string
            - "null"
          format: binary

    TicketCreateResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Tiket berhasil dibuat.
        data:
          $ref: "#/components/schemas/TicketRead"

    RejectTicketRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          example: Informasi kerusakan tidak sesuai.

    ClassifyTicketRequest:
      description: Request dipilih berdasarkan service ticket pada path.
      oneOf:
        - $ref: "#/components/schemas/ClassifyTikTicketRequest"
        - $ref: "#/components/schemas/ClassifySarprasTicketRequest"

    ClassifyTikTicketRequest:
      type: object
      additionalProperties: false
      required:
        - quality_category_id
        - it_tag_id
      properties:
        quality_category_id:
          type: integer
        it_tag_id:
          type: integer
        custom_it_tag_text:
          type:
            - string
            - "null"
          maxLength: 255
          description: Opsional dan hanya boleh diisi ketika IT Tag adalah Lain-lain.

    ClassifySarprasTicketRequest:
      type: object
      additionalProperties: false
      required:
        - sarpras_category_id
      properties:
        sarpras_category_id:
          type: integer
          description: ID kategori aktif Sarpras, Elektronik, atau Alkes.
    AssignTicketRequest:
      type: object
      additionalProperties: false
      required:
        - assigned_officer_id
      properties:
        assigned_officer_id:
          type: integer
          example: 2
        priority:
          type: string
          enum: [critical, high, medium, low]
          description: Wajib pada assignment pertama dan tidak boleh dikirim saat reassignment.

    AssigneeOption:
      type: object
      additionalProperties: false
      required: [id, name, jabatan]
      properties:
        id:
          type: integer
        name:
          type: string
        jabatan:
          type:
            - string
            - "null"

    AssigneeOptionCollectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AssigneeOption"

    EscalateTicketRequest:
      type: object
      additionalProperties: false
      required:
        - target
        - notes
      properties:
        target:
          type: string
          enum: ["Manajemen", "Vendor", "Tim Terkait"]
          example: Vendor
        notes:
          type: string
          minLength: 5
          example: Perlu bantuan teknisi eksternal karena kerusakan komponen utama.

    VerifyTicketRequest:
      type: object
      additionalProperties: false
      required:
        - is_approved
      properties:
        is_approved:
          type: boolean
          example: true
        keterangan_kendala:
          type: string
          description: Diperlukan jika is_approved bernilai false.
          example: Perangkat masih belum menyala secara normal.

    CreateTicketHandlingRequest:
      type: object
      additionalProperties: false
      required:
        - notes
        - status
        - started_at
        - completed_at
      properties:
        notes:
          type: string
          example: Kabel daya dikencangkan dan perangkat diuji.
        status:
          type: string
          enum: [diproses, terselesaikan]
          description: >-
            Status target disimpan pada tickets.status, bukan ticket_handlings.
            Tiket Diproses menerima diproses atau terselesaikan.
          example: diproses
        started_at:
          type: string
          format: date-time
          description: Waktu mulai perbaikan; wajib dan dapat ditentukan petugas.
        completed_at:
          type: string
          format: date-time
          description: >-
            Waktu selesai perbaikan; wajib dan harus sama atau setelah started_at.
        result_photo:
          type:
            - string
            - "null"
          format: binary

    TicketHandling:
      type: object
      additionalProperties: false
      required:
        - id
        - notes
        - status
        - started_at
        - completed_at
        - handled_by
        - result_photo
        - created_at
      properties:
        id:
          type: integer
          example: 1
        notes:
          type: string
          example: Kabel daya dikencangkan dan perangkat diuji.
        status:
          type: string
          enum: [diproses, terselesaikan]
          description: Status tiket saat ini; bukan kolom pada ticket_handlings.
          example: diproses
        started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        handled_by:
          $ref: "#/components/schemas/UserSummary"
        result_photo:
          anyOf:
            - $ref: "#/components/schemas/FileMetadata"
            - type: "null"
        created_at:
          type: string
          format: date-time

    TicketActionResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Tiket berhasil diverifikasi.
        data:
          $ref: "#/components/schemas/TicketRead"

    TicketCollectionResponse:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TicketRead"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    TicketReadResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/TicketRead"

    PaginationLinks:
      type: object
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
        next:
          type:
            - string
            - "null"
          format: uri

    PaginationMeta:
      type: object
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type:
            - integer
            - "null"
        last_page:
          type: integer
          example: 3
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type:
                  - string
                  - "null"
                format: uri
              label:
                type: string
              page:
                type:
                  - integer
                  - "null"
              active:
                type: boolean
        path:
          type: string
          format: uri
        per_page:
          type: integer
          example: 15
        to:
          type:
            - integer
            - "null"
        total:
          type: integer
          example: 42

    TicketReadError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

  responses:
    UserSearchUnauthenticated:
      description: Pengguna belum terautentikasi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserSearchError"
          example:
            message: Unauthenticated.

    UserSearchForbidden:
      description: Pengguna tidak memiliki permission users-access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserSearchError"
          example:
            message: User does not have the right permissions.

    UserSearchValidationError:
      description: Parameter pencarian user tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserSearchError"
          example:
            message: The name field is required.
            errors:
              name:
                - The name field is required.

    TicketUnauthenticated:
      description: Pengguna belum terautentikasi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: Unauthenticated.

    TicketForbidden:
      description: Pengguna tidak memiliki permission yang dibutuhkan endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: User does not have the right permissions.

    TicketNotFound:
      description: Tiket tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: Resource not found.

    TicketValidationError:
      description: Data request tiket tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: The selected service is invalid.
            errors:
              service:
                - The selected service is invalid.

    TicketConflict:
      description: Status tiket tidak mengizinkan aksi workflow.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: Status tiket tidak dapat diubah dari ditutup menjadi diklasifikasi.
