openapi: 3.1.0

info:
  title: SIMPLE-PLAN API
  version: 0.1.0
  description: |
    Kontrak API backend SIMPLE-PLAN RS Citra Husada.

    File ini dikembangkan bertahap mengikuti SRS dan kebutuhan Sprint.
    Hanya endpoint dan struktur data yang sudah disepakati yang sebaiknya
    ditambahkan sebagai kontrak final.

servers:
  - url: /api/v1
    description: Current API version

tags:
  - name: Helpdesk
    description: Pengelolaan tiket Helpdesk TIK dan Sarpras
  - name: Assets
    description: Pencarian asset
  - name: Units
    description: Pencarian unit
  - name: Users
    description: Pengelolaan dan pencarian user

paths:
  /tickets:
    get:
      tags: [Helpdesk]
      summary: Melihat daftar tiket
      operationId: listTickets
      x-auth-required: true
      x-required-permission: tickets-access
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: service
          in: query
          required: false
          description: Jenis layanan tiket.
          schema:
            type: string
            enum: [tik, sarpras]
            example: tik
        - name: status
          in: query
          required: false
          description: Filter status tiket.
          schema:
            type: string
            enum:
              [baru, diklasifikasi, diproses, eskalasi, terselesaikan, ditutup, ditolak]
            example: baru
        - name: priority
          in: query
          required: false
          description: Filter prioritas tiket.
          schema:
            type: string
            enum: [critical, high, medium, low]
            example: high
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Batas akhir tanggal dibuat, bersifat inklusif.
        - name: search
          in: query
          required: false
          description: Pencarian berdasarkan nama reporter atau nama unit tiket.
          schema:
            type: string
            maxLength: 255
        - name: status_sla
          in: query
          required: false
          schema:
            type: string
            enum:
              - melewati_batas
              - mendekati_batas
              - tepat_waktu
          description: Filter tiket berdasarkan status SLA secara on-the-fly.
      responses:
        "200":
          description: Daftar tiket berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCollectionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          $ref: "#/components/responses/TicketValidationError"

    post:
      tags: [Helpdesk]
      summary: Membuat tiket
      operationId: createTicket
      description: Reporter dan unit diambil dari authenticated user. Status awal selalu baru.
      x-auth-required: true
      x-required-permission: tickets-create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Tiket berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCreateResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/classification-options:
    get:
      tags: [Helpdesk]
      summary: Mengambil opsi klasifikasi tiket
      operationId: listTicketClassificationOptions
      description: |
        Mengembalikan master aktif yang diperlukan form klasifikasi. Service
        TIK memperoleh quality_categories dan it_tags, sedangkan service
        Sarpras memperoleh sarpras_categories.
      x-auth-required: true
      x-required-permission: tickets-verify
      parameters:
        - name: service
          in: query
          required: true
          description: Jenis layanan tiket yang akan diklasifikasikan.
          schema:
            type: string
            enum: [tik, sarpras]
            example: tik
      responses:
        "200":
          description: Opsi klasifikasi berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationOptionsResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}:
    get:
      tags: [Helpdesk]
      summary: Melihat detail tiket
      operationId: showTicket
      x-auth-required: true
      x-required-permission: tickets-access
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Detail tiket berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReadResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"

  /tickets/{ticket}/classify:
    post:
      tags: [Helpdesk]
      summary: Mengklasifikasikan tiket baru
      operationId: classifyTicket
      description: |
        TIK hanya dapat diklasifikasikan Super Admin. Sarpras dapat
        diklasifikasikan Super Admin atau Koordinator Sarpras. Capability
        umum endpoint tetap menggunakan permission tickets-verify.
      x-auth-required: true
      x-required-permission: tickets-verify
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyTicketRequest"
      responses:
        "200":
          description: Tiket berhasil diklasifikasikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/reject:
    post:
      tags: [Helpdesk]
      summary: Menolak tiket baru
      operationId: rejectTicket
      description: Actor mengikuti hak klasifikasi service tiket dan tiket harus berstatus baru.
      x-auth-required: true
      x-required-permission: tickets-reject
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTicketRequest"
      responses:
        "200":
          description: Tiket berhasil ditolak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/assignee-options:
    get:
      tags: [Helpdesk]
      summary: Mencari kandidat petugas assignment
      operationId: listTicketAssigneeOptions
      description: |
        Kandidat dibatasi pada user aktif dengan role Petugas TIK atau Petugas
        Sarpras sesuai service ticket. Search mencocokkan name dan jabatan.
      x-auth-required: true
      x-required-permission: tickets-assign
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Kandidat petugas berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssigneeOptionCollectionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/assign:
    post:
      tags: [Helpdesk]
      summary: Assignment atau reassignment tiket
      operationId: assignTicket
      description: |
        TIK hanya dapat di-assign Super Admin kepada Petugas TIK. Sarpras hanya
        dapat di-assign Koordinator Sarpras kepada Petugas Sarpras. Assignment
        pertama dari Diklasifikasi menentukan priority, langsung mengubah status
        menjadi Diproses, serta mencatat sla_started_at dan SLA deadline.
        Reassignment dari Diproses hanya mengganti petugas dan assigned_at;
        waktu mulai serta deadline SLA pertama tidak direset.
      x-auth-required: true
      x-required-permission: tickets-assign
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: Assignment atau reassignment berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/handlings:
    post:
      tags: [Helpdesk]
      summary: Menambahkan riwayat penanganan tiket
      operationId: createTicketHandling
      description: |
        Super Admin dapat menangani tiket TIK dan Sarpras tanpa assignment.
        Koordinator Sarpras dapat menangani tiket Sarpras tanpa assignment.
        Petugas TIK dan Petugas Sarpras hanya dapat menangani tiket yang sedang
        ditugaskan kepadanya sesuai service masing-masing.
        Tiket Diproses dapat tetap Diproses tanpa status history atau menjadi
        Terselesaikan dengan status history. tickets.completed_at berasal dari
        completed_at yang diinput petugas, bukan dari waktu perubahan status.
        Operasi tidak menghitung ulang SLA. Membutuhkan permission tickets-handle.
      x-auth-required: true
      x-required-permission: tickets-handle
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTicketHandlingRequest"
      responses:
        "200":
          description: Riwayat penanganan berhasil disimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/escalate:
    post:
      tags: [Helpdesk]
      summary: Mengeskalasi tiket Helpdesk
      operationId: escalateTicket
      description: |
        Petugas penanganan tiket dapat mengeskalasi tiket ke Manajemen, Vendor,
        atau Tim Terkait. Membutuhkan permission tickets-handle.
      x-auth-required: true
      x-required-permission: tickets-handle
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateTicketRequest"
      responses:
        "200":
          description: Tiket berhasil dieskalasikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /tickets/{ticket}/de-escalate:
    post:
      tags: [Helpdesk]
      summary: Melanjutkan penanganan tiket setelah eskalasi
      operationId: deEscalateTicket
      description: |
        Petugas yang ditugaskan dapat mengembalikan tiket berstatus Eskalasi
        ke Diproses. Membutuhkan permission tickets-handle.
      x-auth-required: true
      x-required-permission: tickets-handle
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Tiket kembali diproses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"

  /tickets/{ticket}/verify:
    post:
      tags: [Helpdesk]
      summary: Memverifikasi penyelesaian tiket
      operationId: verifyTicketResolution
      description: |
        Hanya reporter tiket yang dapat memverifikasi tiket berstatus
        Terselesaikan. Verifikasi langsung mengubah status menjadi Ditutup tanpa
        status perantara Terverifikasi dan mencatat closed_at serta status history.
      x-auth-required: true
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTicketRequest"
      responses:
        "200":
          description: Penyelesaian diverifikasi dan tiket ditutup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketActionResponse"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "422":
          $ref: "#/components/responses/TicketValidationError"

  /assets/search:
    get:
      tags: [Assets]
      summary: Mencari asset berdasarkan nomor atau nama
      operationId: searchAssets
      description: Mengembalikan asset pada unit yang dipilih dengan asset_number atau name yang mengandung nilai search.
      x-auth-required: true
      x-required-permission: tickets-create
      parameters:
        - name: unit
          in: query
          required: true
          description: ID unit asset.
          schema:
            type: integer
            example: 1
        - name: search
          in: query
          required: false
          description: Nomor atau nama asset yang dicari.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: Meja
      responses:
        "200":
          description: Hasil pencarian asset berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssetSummary"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          description: Parameter pencarian asset tidak valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReadError"

  /units/search:
    get:
      tags: [Units]
      summary: Mencari unit berdasarkan nama
      operationId: searchUnits
      description: Mengembalikan unit yang unit_name-nya mengandung nilai search.
      x-auth-required: true
      x-required-permission: tickets-create
      parameters:
        - name: search
          in: query
          required: false
          description: Nama atau sebagian nama unit yang dicari.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: ICU
      responses:
        "200":
          description: Hasil pencarian unit berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnitSearchResult"
        "401":
          $ref: "#/components/responses/TicketUnauthenticated"
        "403":
          $ref: "#/components/responses/TicketForbidden"
        "422":
          description: Parameter pencarian unit tidak valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReadError"

  /users/search:
    get:
      tags: [Users]
      summary: Mencari user berdasarkan nama
      operationId: searchUsersByName
      description: Mengembalikan user yang namanya mengandung nilai parameter name beserta unitnya.
      x-auth-required: true
      x-required-permission: users-access
      parameters:
        - name: name
          in: query
          required: true
          description: Nama atau sebagian nama user yang dicari.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: Rani
      responses:
        "200":
          description: Hasil pencarian user berhasil diambil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchCollectionResponse"
        "401":
          $ref: "#/components/responses/UserSearchUnauthenticated"
        "403":
          $ref: "#/components/responses/UserSearchForbidden"
        "422":
          $ref: "#/components/responses/UserSearchValidationError"

components:
  parameters:
    TicketId:
      name: ticket
      in: path
      required: true
      schema:
        type: integer
      description: ID internal tiket.

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

  schemas:
    UnitSearchResult:
      type: object
      additionalProperties: false
      required: [id, unit_name]
      properties:
        id:
          type: integer
          example: 1
        unit_name:
          type: string
          example: ICU

    UserSearchResult:
      type: object
      additionalProperties: false
      required: [id, name, unit]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Dr. Rani
        unit:
          oneOf:
            - $ref: "#/components/schemas/UserSearchUnit"
            - type: "null"

    UserSearchUnit:
      type: object
      additionalProperties: false
      required: [id, unit_name]
      properties:
        id:
          type: integer
          example: 3
        unit_name:
          type: string
          example: ICU

    UserSearchCollectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserSearchResult"

    UserSearchError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    TicketRead:
      type: object
      additionalProperties: false
      required:
        - id
        - ticket_number
        - service
        - category
        - tik_detail
        - sarpras_detail
        - description
        - status
        - rejection_reason
        - priority
        - asset
        - reporter
        - unit
        - assigned_officer
        - classified_by
        - initial_evidence
        - classified_at
        - assigned_at
        - sla_started_at
        - sla_deadline
        - completed_at
        - closed_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        ticket_number:
          type: string
          pattern: "^(TIK|SPR)-[0-9]{4}-[0-9]{6}$"
          example: TIK-2026-000001
        service:
          type: string
          enum: [tik, sarpras]
          description: Jenis layanan tiket.
          example: tik
        category:
          type:
            - string
            - "null"
          description: Label kompatibilitas yang diturunkan dari detail klasifikasi tiket.
          example: Perangkat Komputer
        tik_detail:
          anyOf:
            - $ref: "#/components/schemas/TicketTikDetail"
            - type: "null"
        sarpras_detail:
          anyOf:
            - $ref: "#/components/schemas/TicketSarprasDetail"
            - type: "null"
        description:
          type: string
          example: Komputer tidak dapat menyala.
        status:
          type: string
          enum: [baru, diklasifikasi, diproses, eskalasi, terselesaikan, ditutup, ditolak]
          example: baru
        rejection_reason:
          type:
            - string
            - "null"
          description: Field kompatibilitas dari notes status history penolakan terbaru.
          example: Informasi kerusakan tidak sesuai.
        priority:
          type:
            - string
            - "null"
          enum: [critical, high, medium, low, null]
          example: high
        asset:
          anyOf:
            - $ref: "#/components/schemas/AssetSummary"
            - type: "null"
        reporter:
          $ref: "#/components/schemas/UserSummary"
        unit:
          $ref: "#/components/schemas/UnitSummary"
        assigned_officer:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        classified_by:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        initial_evidence:
          anyOf:
            - $ref: "#/components/schemas/FileMetadata"
            - type: "null"
        classified_at:
          type:
            - string
            - "null"
          format: date-time
        assigned_at:
          type:
            - string
            - "null"
          format: date-time
        sla_started_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu tiket pertama kali masuk Diproses dan SLA mulai berjalan.
        sla_deadline:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        closed_at:
          type:
            - string
            - "null"
          format: date-time
        handlings:
          type: array
          description: Tersedia pada response detail dan pembaruan penanganan.
          items:
            $ref: "#/components/schemas/TicketHandling"
        status_histories:
          type: array
          description: Tersedia pada response detail tiket.
          items:
            $ref: "#/components/schemas/TicketStatusHistory"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    UnitSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    AssetSummary:
      type: object
      additionalProperties: false
      required: [id, asset_number, name, brand, location, status]
      properties:
        id:
          type: integer
        asset_number:
          type: string
        name:
          type: string
        brand:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        status:
          type: string

    TicketStatusHistory:
      type: object
      additionalProperties: false
      required: [id, from_status, to_status, changed_by, notes, created_at]
      properties:
        id:
          type: integer
        from_status:
          type:
            - string
            - "null"
          enum:
            [
              baru,
              diklasifikasi,
              ditugaskan,
              diproses,
              eskalasi,
              terselesaikan,
              terverifikasi,
              ditutup,
              ditolak,
              null,
            ]
        to_status:
          type: string
          enum:
            [
              baru,
              diklasifikasi,
              ditugaskan,
              diproses,
              eskalasi,
              terselesaikan,
              terverifikasi,
              ditutup,
              ditolak,
            ]
        changed_by:
          anyOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        notes:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time

    TicketNamedReference:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    ClassificationOptionsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [service, quality_categories, it_tags, sarpras_categories]
          properties:
            service:
              type: string
              enum: [tik, sarpras]
            quality_categories:
              type: array
              description: Berisi data hanya ketika service adalah tik.
              items:
                $ref: "#/components/schemas/TicketNamedReference"
            it_tags:
              type: array
              description: Berisi IT tag aktif hanya ketika service adalah tik.
              items:
                $ref: "#/components/schemas/TicketNamedReference"
            sarpras_categories:
              type: array
              description: Berisi kategori aktif hanya ketika service adalah sarpras.
              items:
                $ref: "#/components/schemas/TicketNamedReference"

    TicketTikDetail:
      type: object
      additionalProperties: false
      required:
        - quality_category
        - it_tag
        - custom_it_tag_text
      properties:
        quality_category:
          $ref: "#/components/schemas/TicketNamedReference"
        it_tag:
          $ref: "#/components/schemas/TicketNamedReference"
        custom_it_tag_text:
          type:
            - string
            - "null"

    TicketSarprasDetail:
      type: object
      additionalProperties: false
      required:
        - sarpras_category
      properties:
        sarpras_category:
          $ref: "#/components/schemas/TicketNamedReference"

    FileMetadata:
      type: object
      additionalProperties: false
      required:
        - original_name
        - mime_type
        - size
      properties:
        original_name:
          type: string
          example: kerusakan-komputer.jpg
        mime_type:
          type: string
          example: image/jpeg
        size:
          type: integer
          description: Ukuran file dalam byte.
          example: 245760
        url:
          type: string
          format: uri
          description: Temporary URL yang hanya disertakan pada response detail/show ticket dan dihasilkan saat runtime dari object key pada configured filesystem disk.
          example: https://simple-plan.internal/storage/local/helpdesk/evidence/example.jpg?expires=1790985600&signature=example

    CreateTicketRequest:
      type: object
      required:
        - service
        - description
      properties:
        service:
          type: string
          enum: [tik, sarpras]
          example: tik
        asset_id:
          type:
            - integer
            - "null"
          description: Asset aktif yang terkait dengan tiket, jika ada.
        description:
          type: string
        initial_evidence:
          type:
            - string
            - "null"
          format: binary

    TicketCreateResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Tiket berhasil dibuat.
        data:
          $ref: "#/components/schemas/TicketRead"

    RejectTicketRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          example: Informasi kerusakan tidak sesuai.

    ClassifyTicketRequest:
      description: Request dipilih berdasarkan service ticket pada path.
      oneOf:
        - $ref: "#/components/schemas/ClassifyTikTicketRequest"
        - $ref: "#/components/schemas/ClassifySarprasTicketRequest"

    ClassifyTikTicketRequest:
      type: object
      additionalProperties: false
      required:
        - quality_category_id
        - it_tag_id
      properties:
        quality_category_id:
          type: integer
        it_tag_id:
          type: integer
        custom_it_tag_text:
          type:
            - string
            - "null"
          maxLength: 255
          description: Opsional dan hanya boleh diisi ketika IT Tag adalah Lain-lain.

    ClassifySarprasTicketRequest:
      type: object
      additionalProperties: false
      required:
        - sarpras_category_id
      properties:
        sarpras_category_id:
          type: integer
          description: ID kategori aktif Sarpras, Elektronik, atau Alkes.
    AssignTicketRequest:
      type: object
      additionalProperties: false
      required:
        - assigned_officer_id
      properties:
        assigned_officer_id:
          type: integer
          example: 2
        priority:
          type: string
          enum: [critical, high, medium, low]
          description: Wajib pada assignment pertama dan tidak boleh dikirim saat reassignment.

    AssigneeOption:
      type: object
      additionalProperties: false
      required: [id, name, jabatan]
      properties:
        id:
          type: integer
        name:
          type: string
        jabatan:
          type:
            - string
            - "null"

    AssigneeOptionCollectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AssigneeOption"

    EscalateTicketRequest:
      type: object
      additionalProperties: false
      required:
        - target
        - notes
      properties:
        target:
          type: string
          enum: ["Manajemen", "Vendor", "Tim Terkait"]
          example: Vendor
        notes:
          type: string
          minLength: 5
          example: Perlu bantuan teknisi eksternal karena kerusakan komponen utama.

    VerifyTicketRequest:
      type: object
      additionalProperties: false
      required:
        - is_approved
      properties:
        is_approved:
          type: boolean
          example: true
        keterangan_kendala:
          type: string
          description: Diperlukan jika is_approved bernilai false.
          example: Perangkat masih belum menyala secara normal.

    CreateTicketHandlingRequest:
      type: object
      additionalProperties: false
      required:
        - notes
        - status
        - started_at
        - completed_at
      properties:
        notes:
          type: string
          example: Kabel daya dikencangkan dan perangkat diuji.
        status:
          type: string
          enum: [diproses, terselesaikan]
          description: >-
            Status target disimpan pada tickets.status, bukan ticket_handlings.
            Tiket Diproses menerima diproses atau terselesaikan.
          example: diproses
        started_at:
          type: string
          format: date-time
          description: Waktu mulai perbaikan; wajib dan dapat ditentukan petugas.
        completed_at:
          type: string
          format: date-time
          description: >-
            Waktu selesai perbaikan; wajib dan harus sama atau setelah started_at.
        result_photo:
          type:
            - string
            - "null"
          format: binary

    TicketHandling:
      type: object
      additionalProperties: false
      required:
        - id
        - notes
        - status
        - started_at
        - completed_at
        - handled_by
        - result_photo
        - created_at
      properties:
        id:
          type: integer
          example: 1
        notes:
          type: string
          example: Kabel daya dikencangkan dan perangkat diuji.
        status:
          type: string
          enum: [diproses, terselesaikan]
          description: Status tiket saat ini; bukan kolom pada ticket_handlings.
          example: diproses
        started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        handled_by:
          $ref: "#/components/schemas/UserSummary"
        result_photo:
          anyOf:
            - $ref: "#/components/schemas/FileMetadata"
            - type: "null"
        created_at:
          type: string
          format: date-time

    TicketActionResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Tiket berhasil diverifikasi.
        data:
          $ref: "#/components/schemas/TicketRead"

    TicketCollectionResponse:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TicketRead"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    TicketReadResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/TicketRead"

    PaginationLinks:
      type: object
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
        next:
          type:
            - string
            - "null"
          format: uri

    PaginationMeta:
      type: object
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type:
            - integer
            - "null"
        last_page:
          type: integer
          example: 3
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type:
                  - string
                  - "null"
                format: uri
              label:
                type: string
              page:
                type:
                  - integer
                  - "null"
              active:
                type: boolean
        path:
          type: string
          format: uri
        per_page:
          type: integer
          example: 15
        to:
          type:
            - integer
            - "null"
        total:
          type: integer
          example: 42

    TicketReadError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

  responses:
    UserSearchUnauthenticated:
      description: Pengguna belum terautentikasi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserSearchError"
          example:
            message: Unauthenticated.

    UserSearchForbidden:
      description: Pengguna tidak memiliki permission users-access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserSearchError"
          example:
            message: User does not have the right permissions.

    UserSearchValidationError:
      description: Parameter pencarian user tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserSearchError"
          example:
            message: The name field is required.
            errors:
              name:
                - The name field is required.

    TicketUnauthenticated:
      description: Pengguna belum terautentikasi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: Unauthenticated.

    TicketForbidden:
      description: Pengguna tidak memiliki permission yang dibutuhkan endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: User does not have the right permissions.

    TicketNotFound:
      description: Tiket tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: Resource not found.

    TicketValidationError:
      description: Data request tiket tidak valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: The selected service is invalid.
            errors:
              service:
                - The selected service is invalid.

    TicketConflict:
      description: Status tiket tidak mengizinkan aksi workflow.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TicketReadError"
          example:
            message: Status tiket tidak dapat diubah dari ditutup menjadi diklasifikasi.
